name: Data tooling

on:
  push:
    branches:
      - main
      - "foundation/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python tooling
        run: python -m py_compile scripts/data/*.py

      - name: Validate JSON schema syntax
        run: |
          python -m json.tool schema/music-spec-v1.schema.json > /dev/null
          python -m json.tool schema/knowledge-curation-decisions-v1.schema.json > /dev/null
          python -m json.tool schema/knowledge-curation-decisions-v2.schema.json > /dev/null
          python -m json.tool schema/runtime-pack-v1.schema.json > /dev/null

      - name: Run synthetic local-data tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.27.1

      - name: Install TypeScript workspace
        run: pnpm install --frozen-lockfile

      - name: Validate TypeScript foundation
        run: pnpm run check
